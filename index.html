<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOST SIGHT</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000000;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 12vw;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .social-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 32px;
    }
    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }
    .social-links a img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      transition: opacity 0.2s ease;
    }
    .social-links a:hover img {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <img src="img/Logo_900.png" alt="LOST SIGHT" style="width: 50%; max-width: 900px;">
  <div class="social-links">
    <a href="https://www.youtube.com/@voltdronegames" target="_blank" rel="noreferrer noopener" aria-label="YouTube">
      <img src="img/youtube.png" alt="YouTube">
    </a>
    <a href="https://www.instagram.com/voltdronegames/" target="_blank" rel="noreferrer noopener" aria-label="Instagram">
      <img src="img/instagram.png" alt="Instagram">
    </a>
  </div>
</body>
</html>
